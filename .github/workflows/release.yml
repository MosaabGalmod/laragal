name: Build and Release LaraGal

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Distribution
        working-directory: ./frontend
        run: npm run build

      - name: Run Go Unit Tests
        run: go test ./... -v

      - name: Compile LaraGal Standalone Binary
        run: go build -ldflags "-s -w -H windowsgui" -o laragal.exe .

      - name: Package Release ZIP
        run: |
          Compress-Archive -Path laragal.exe, LICENSE, README.md -DestinationPath LaraGal-Windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            LaraGal-Windows-x64.zip
            laragal.exe
          generate_release_notes: true
